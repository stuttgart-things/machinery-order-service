name: Build, Push & Scan Container Image
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ko-build.yaml@15bb803fd72658fda50120f8a566d5594061e6ee # v1.2.0
    with:
      runs-on: ubuntu-latest
      go-version: "1.27.4"
    secrets: inherit
