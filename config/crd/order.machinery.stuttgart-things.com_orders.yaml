---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: orders.order.machinery.stuttgart-things.com
spec:
  group: order.machinery.stuttgart-things.com
  names:
    kind: Order
    listKind: OrderList
    plural: orders
    shortNames:
    - ord
    singular: order
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.template
      name: Template
      type: string
    - jsonPath: .spec.placement.managementCluster
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.delivery.pullRequest.url
      name: PR
      priority: 1
      type: string
    - jsonPath: .spec.requestedBy
      name: Requested-By
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Order is one order of a resource through machinery-order-service. Its name
          is the order ID.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OrderSpec is what was ordered. Only Cancel changes after
              the intake.
            properties:
              cancel:
                description: |-
                  Cancel asks to withdraw the order. Before the merge the pull request is
                  closed and the order ends Cancelled; after the merge it is refused
                  (that needs a teardown, which comes later).
                type: boolean
              delivery:
                default: pullRequest
                description: Delivery is how the files reach git.
                enum:
                - pullRequest
                type: string
              parameters:
                description: |-
                  Parameters are the template parameters as the orderer gave them, a JSON
                  object. The service adds order_id, management_cluster, source_path and
                  environment_config from the placement.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              placement:
                description: Placement pins the order to a management cluster.
                properties:
                  infraTarget:
                    description: |-
                      InfraTarget is the infrastructure the order lands on (later, with the
                      scheduler); informational for now.
                    type: string
                  managementCluster:
                    description: |-
                      ManagementCluster is the name of the ManagementCluster that applies the
                      order. The first version knows pinned placement only, so it is required.
                    minLength: 1
                    type: string
                required:
                - managementCluster
                type: object
              reason:
                description: Reason is a free-text note from the orderer, shown in
                  the PR body.
                maxLength: 500
                type: string
              rendered:
                description: |-
                  Rendered is the order as the API rendered it at intake, with the
                  orderer's token (so claim-machinery-api bound requested_by/owner to the
                  login). When it is empty, the controller renders with the service's own
                  identity and keeps the result in status.rendered.
                properties:
                  files:
                    description: Files are the files the order writes, in render order.
                    items:
                      description: RenderedFile is one file of the rendered order.
                      properties:
                        content:
                          description: Content is the file as written.
                          type: string
                        path:
                          description: Path is relative to the repository root.
                          type: string
                      required:
                      - content
                      - path
                      type: object
                    type: array
                  parameters:
                    description: |-
                      Parameters are the parameters sent to claim-machinery-api, a JSON
                      object.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  renderedAt:
                    description: RenderedAt is when it was rendered.
                    format: date-time
                    type: string
                required:
                - files
                - renderedAt
                type: object
              requestedBy:
                description: RequestedBy is the orderer (user:default/<name>), taken
                  from the token.
                type: string
              template:
                description: Template is the claim-machinery-api ClaimTemplate to
                  render.
                minLength: 1
                type: string
            required:
            - placement
            - template
            type: object
            x-kubernetes-validations:
            - message: template and placement are immutable
              rule: self.template == oldSelf.template && self.placement == oldSelf.placement
            - message: rendered is immutable once set
              rule: '!has(oldSelf.rendered) || (has(self.rendered) && self.rendered
                == oldSelf.rendered)'
          status:
            description: OrderStatus is where the order stands.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              delivery:
                description: DeliveryStatus is the git side of an order.
                properties:
                  baseBranch:
                    type: string
                  branch:
                    type: string
                  commitSHA:
                    description: CommitSHA is the commit on Branch with the order's
                      files.
                    type: string
                  kustomizations:
                    description: Kustomizations are the kustomization.yaml files the
                      order appended to.
                    items:
                      type: string
                    type: array
                  mergeSHA:
                    description: MergeSHA is the commit on the base branch that brought
                      the files in.
                    type: string
                  pullRequest:
                    description: PullRequest is the pull request that delivers the
                      order.
                    properties:
                      number:
                        type: integer
                      state:
                        description: State is open, closed or merged.
                        type: string
                      url:
                        type: string
                    required:
                    - number
                    - state
                    - url
                    type: object
                  repository:
                    description: Repository is owner/name.
                    type: string
                type: object
              files:
                description: Files are the repository paths of every file the order
                  writes.
                items:
                  type: string
                type: array
              flux:
                description: FluxStatus is whether Flux on the management cluster
                  applied the merge.
                properties:
                  appliedAt:
                    format: date-time
                    type: string
                  lastAppliedRevision:
                    description: |-
                      LastAppliedRevision of the management cluster's Kustomization, as
                      machinery reports it (e.g. main@sha1:<sha>).
                    type: string
                type: object
              history:
                description: History is the phase timeline, oldest first.
                items:
                  description: PhaseTransition is one step of the order's timeline.
                  properties:
                    message:
                      type: string
                    phase:
                      description: Phase is where an order stands, across git and
                        the live side.
                      enum:
                      - Ordered
                      - Placed
                      - PROpen
                      - Merged
                      - Applied
                      - Building
                      - Ready
                      - Cancelled
                      - Failed
                      type: string
                    time:
                      format: date-time
                      type: string
                  required:
                  - phase
                  - time
                  type: object
                type: array
              live:
                description: LiveStatus is the XR as machinery sees it.
                properties:
                  address:
                    description: Address is machinery's connection details (for a
                      VM, its IP).
                    type: string
                  found:
                    type: boolean
                  info:
                    additionalProperties:
                      type: string
                    description: Info are machinery's extra status fields.
                    type: object
                  observedAt:
                    format: date-time
                    type: string
                  ready:
                    type: boolean
                  statusMessage:
                    type: string
                required:
                - found
                - ready
                type: object
              message:
                description: Message explains the phase, or the last error.
                type: string
              observedGeneration:
                format: int64
                type: integer
              orderID:
                description: OrderID is the order ID, the same as the Order's name.
                type: string
              phase:
                description: Phase is where an order stands, across git and the live
                  side.
                enum:
                - Ordered
                - Placed
                - PROpen
                - Merged
                - Applied
                - Building
                - Ready
                - Cancelled
                - Failed
                type: string
              placement:
                description: Placement is where the order went.
                properties:
                  infraTarget:
                    description: |-
                      InfraTarget is the infrastructure the order lands on (later, with the
                      scheduler); informational for now.
                    type: string
                  managementCluster:
                    description: |-
                      ManagementCluster is the name of the ManagementCluster that applies the
                      order. The first version knows pinned placement only, so it is required.
                    minLength: 1
                    type: string
                required:
                - managementCluster
                type: object
              rendered:
                description: |-
                  Rendered is set when the controller rendered the order (spec.rendered
                  was empty).
                properties:
                  files:
                    description: Files are the files the order writes, in render order.
                    items:
                      description: RenderedFile is one file of the rendered order.
                      properties:
                        content:
                          description: Content is the file as written.
                          type: string
                        path:
                          description: Path is relative to the repository root.
                          type: string
                      required:
                      - content
                      - path
                      type: object
                    type: array
                  parameters:
                    description: |-
                      Parameters are the parameters sent to claim-machinery-api, a JSON
                      object.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  renderedAt:
                    description: RenderedAt is when it was rendered.
                    format: date-time
                    type: string
                required:
                - files
                - renderedAt
                type: object
              xrRef:
                description: ObjectRef names the XR the order creates.
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - kind
                - name
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
