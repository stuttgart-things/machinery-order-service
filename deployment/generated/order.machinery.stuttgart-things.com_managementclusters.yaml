---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: managementclusters.order.machinery.stuttgart-things.com
spec:
  group: order.machinery.stuttgart-things.com
  names:
    kind: ManagementCluster
    listKind: ManagementClusterList
    plural: managementclusters
    shortNames:
    - mc
    singular: managementcluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.lab
      name: Lab
      type: string
    - jsonPath: .spec.gitops.ordersPath
      name: Orders
      type: string
    - jsonPath: .spec.cordoned
      name: Cordoned
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ManagementCluster is a cluster orders can be placed on.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ManagementClusterSpec describes a cluster that applies orders: Flux pulls
              its orders directory, Crossplane builds the XRs.
            properties:
              cordoned:
                description: Cordoned refuses new orders.
                type: boolean
              flux:
                description: |-
                  Flux is the applied check. Without it an order goes from Merged to
                  Building once machinery sees its XR.
                properties:
                  kind:
                    default: Kustomization
                    description: Kind is the kind machinery serves the Kustomization
                      under.
                    type: string
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    default: flux-system
                    type: string
                  revisionField:
                    default: lastAppliedRevision
                    description: |-
                      RevisionField is the machinery info field holding
                      status.lastAppliedRevision.
                    type: string
                required:
                - name
                type: object
              gitops:
                description: GitOps is where a management cluster's orders live in
                  git.
                properties:
                  baseBranch:
                    default: main
                    description: BaseBranch is the branch Flux applies.
                    type: string
                  ordersPath:
                    description: |-
                      OrdersPath is the directory the XR files go to, e.g.
                      clusters/labda/vsphere/machinery-orders-xrs. Passed to the template as
                      source_path = <OrdersPath>/<name>.yaml; empty leaves the template's
                      default.
                    type: string
                  repository:
                    default: stuttgart-things/stuttgart-things
                    description: Repository is owner/name on GitHub.
                    type: string
                type: object
              lab:
                description: Lab is informational (labda, labul).
                type: string
              machinery:
                description: Machinery is the live side.
                properties:
                  endpoint:
                    description: Endpoint is machinery's gRPC address, host:port.
                    minLength: 1
                    type: string
                  insecure:
                    description: Insecure dials without TLS (in-cluster or tests).
                    type: boolean
                  tokenSecretRef:
                    description: TokenSecretRef holds machinery's gRPC bearer token,
                      if it wants one.
                    properties:
                      key:
                        default: token
                        type: string
                      name:
                        type: string
                      namespace:
                        description: Namespace defaults to the service's namespace.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - endpoint
                type: object
              render:
                description: Render is what the management cluster adds to every order's
                  parameters.
                properties:
                  clusterName:
                    description: |-
                      ClusterName is passed as management_cluster; empty = the
                      ManagementCluster's name.
                    type: string
                  environmentConfig:
                    description: |-
                      EnvironmentConfig is passed as environment_config; empty leaves the
                      template's default (the lab's).
                    type: string
                type: object
            type: object
          status:
            description: ManagementClusterStatus is what the service last saw of the
              cluster.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
